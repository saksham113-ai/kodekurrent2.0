
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kode Kurrent '26 | Environment IDE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ide: {
                bg: '#0d1117',
                sidebar: '#161b22',
                header: '#010409',
                active: '#21262d',
                border: '#30363d',
                muted: '#8b949e',
                keyword: '#ff7b72',
                variable: '#ffa657',
                string: '#a5d6ff',
                function: '#d2a8ff',
                number: '#79c0ff',
                accent: '#3fb950',
                text: '#c9d1d9'
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            animation: {
              'cursor-blink': 'cursorBlink 1s step-end infinite',
              'fade-in': 'fadeIn 0.5s ease-out forwards',
              'slide-up': 'slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'pulse-soft': 'pulseSoft 2s ease-in-out infinite',
              'typewriter': 'typewriter 3s steps(40) forwards',
              'grid-move': 'gridMove 20s linear infinite',
              'marquee': 'marquee 30s linear infinite',
              'spin-slow': 'spin 12s linear infinite',
              'spin-reverse-slow': 'spin 15s linear infinite reverse',
            },
            keyframes: {
              cursorBlink: {
                '0%, 100%': { opacity: 1 },
                '50%': { opacity: 0 }
              },
              fadeIn: {
                '0%': { opacity: 0 },
                '100%': { opacity: 1 }
              },
              slideUp: {
                '0%': { transform: 'translateY(20px)', opacity: 0 },
                '100%': { transform: 'translateY(0)', opacity: 1 }
              },
              pulseSoft: {
                '0%, 100%': { opacity: 0.8 },
                '50%': { opacity: 0.4 }
              },
              typewriter: {
                '0%': { width: '0%' },
                '100%': { width: '100%' }
              },
              gridMove: {
                '0%': { backgroundPosition: '0 0' },
                '100%': { backgroundPosition: '50px 50px' }
              },
              marquee: {
                '0%': { transform: 'translateX(0)' },
                '100%': { transform: 'translateX(-50%)' }
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #0d1117;
        color: #c9d1d9;
        scrollbar-width: thin;
        scrollbar-color: #30363d transparent;
        overflow-x: hidden;
      }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 5px; }
      ::-webkit-scrollbar-thumb:hover { background: #484f58; }
      
      .code-block {
        font-family: 'JetBrains Mono', monospace;
        line-height: 1.6;
      }
      .line-number {
        color: #484f58;
        padding-right: 1.5rem;
        text-align: right;
        user-select: none;
        width: 3.5rem;
        display: inline-block;
      }
      .reveal {
        opacity: 0;
        transform: translateY(10px);
        transition: all 0.5s ease-out;
      }
      .reveal.active {
        opacity: 1;
        transform: translateY(0);
      }
      .syntax-keyword { color: #ff7b72; }
      .syntax-string { color: #a5d6ff; }
      .syntax-comment { color: #8b949e; font-style: italic; }
      .syntax-fn { color: #d2a8ff; }
      .syntax-num { color: #79c0ff; }
      .syntax-var { color: #ffa657; }

      .glowing-text {
        text-shadow: 0 0 15px rgba(210, 168, 255, 0.3);
      }

      .typewriter-container {
        display: inline-block;
        overflow: hidden;
        white-space: nowrap;
        border-right: 2px solid #ff7b72;
        width: 0;
        animation: typewriter 2s steps(40) 1s forwards, cursorBlink 1s step-end infinite;
      }

      .code-rain {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-image: 
          linear-gradient(rgba(13, 17, 23, 0.95), rgba(13, 17, 23, 0.95)),
          linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
          linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        background-size: 100% 100%, 50px 50px, 50px 50px;
        pointer-events: none;
        z-index: 0;
      }

      ::selection {
        background: rgba(56, 139, 253, 0.3);
        color: #fff;
      }

      .marquee-wrapper {
        display: flex;
        width: max-content;
        flex-wrap: nowrap;
      }

      .cyber-ring {
        position: relative;
        padding: 20px;
        border-radius: 50%;
        border: 2px solid rgba(210, 168, 255, 0.1);
      }
      .cyber-ring::before, .cyber-ring::after {
        content: '';
        position: absolute;
        inset: -10px;
        border-radius: 50%;
        border: 2px dashed rgba(210, 168, 255, 0.3);
        animation: spin 20s linear infinite;
      }
      .cyber-ring::after {
        inset: -20px;
        border: 1px solid rgba(165, 214, 255, 0.2);
        animation: spin 30s linear infinite reverse;
      }

      .team-banner {
        clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
        background: linear-gradient(135deg, rgba(33, 38, 45, 0.9), rgba(1, 4, 9, 0.9));
        border-left: 4px solid #d2a8ff;
      }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "lucide-react": "https://esm.sh/lucide-react@^0.564.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.41.0"
  }
}
</script>

</head>

</body>
</html>
